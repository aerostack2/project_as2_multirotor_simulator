/**:
  # Global Parameters
  ros__parameters:
    tf_timeout_threshold: 0.05

/**:
  # Basic Robotics Functions
  platform:
    ros__parameters:
      cmd_freq: 100.0  # Hz of platform commands send
      # # Raw Odometry
      # use_odom_for_control: true  # Use odometry for control instead of ground truth (default: false)

  # State Estimator
  state_estimator:
    ros__parameters:
      # Indoor Ground Truth
      plugin_name: "ground_truth"

      # # Indoor Raw Odometry
      # plugin_name: "raw_odometry"

      # # Outdoor (GPS) Raw Odometry
      # plugin_name: "raw_odometry"
      # raw_odometry:
      #   use_gps: true  # earth->map comes from the first GPS fix. Replaces the old
      #                  # use_gps + set_origin_on_start pair; the first fix now always
      #                  # sets the origin, so set_origin_on_start no longer exists.
      #                  # GPS lives on raw_odometry only — ground_truth has no GPS path.

      # # Ground truth fused with the IMU (simple_ekf)
      # # Might need imu values and covariance tuning.
      # plugin_name: "simple_ekf"
      # simple_ekf:
      #   update_topics: ["gt_pose"]
      #   gt_pose:
      #     topic: "ground_truth/pose"
      #     type: "geometry_msgs/msg/PoseStamped"
      #     set_earth_map: true
      #     use_message_covariance: false  # Use the fixed values below, not the message's.
      #     position_covariance: [1e-4, 1e-4, 1e-4]     # x, y, z — variance, sigma ~ 1 cm
      #     orientation_covariance: [1e-5, 1e-5, 1e-5]  # roll, pitch, yaw — sigma ~ 0.2 deg

  # Motion Controller
  controller_manager:
    ros__parameters:
      cmd_freq: 100.0 # Hz of controller commands send

  # Behaviors Motion
  TakeoffBehavior:
    ros__parameters:
      # takeoff_plugin_name: "takeoff_plugin_speed"
      takeoff_plugin_name: "takeoff_plugin_position"
      # takeoff_plugin_name: "takeoff_plugin_platform"
      # takeoff_plugin_name: "takeoff_plugin_trajectory"
  LandBehavior:
    ros__parameters:
      land_plugin_name: "land_plugin_speed"
      # land_plugin_name: "land_plugin_platform"
      # land_plugin_name: "land_plugin_trajectory"
  GoToBehavior:
    ros__parameters:
      go_to_plugin_name: "go_to_plugin_position"
      # go_to_plugin_name: "go_to_plugin_trajectory"
  FollowPathBehavior:
    ros__parameters:
      follow_path_plugin_name: "follow_path_plugin_position"
      # follow_path_plugin_name: "follow_path_plugin_trajectory"

  # Trajectory Generation Behavior
  TrajectoryGeneratorBehavior:
    ros__parameters:
      plugin_name: "dynamic_mav_trajectory_generator"

  # Behaviors Perception
  point_gimbal_behavior:
    ros__parameters:
      behavior_timeout: 10.0 # Timeout (s) for the action server
      gimbal_name: gimbal # Name of the gimbal
      gimbal_frame_id: gimbal # Name of the gimbal frame
      gimbal_base_frame_id: gimbal_base # Name of the base frame of the gimbal
      gimbal_threshold: 0.01 # Threshold for the gimbal angle